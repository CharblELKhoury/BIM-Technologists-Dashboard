<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>BIM Technologists — Google Ads Performance</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f5f4;--white:#fff;--border:#e0e0dc;--borderl:#ececE8;
  --text:#101114;--t2:#474a50;--t3:#8b8e94;
  --brand:#B72025;--brand2:#E42E46;--bbg:#fdf0f1;
  --green:#166f40;--gbg:#eaf5f0;--red:#b02e24;--rbg:#fdf0ef;
  --amber:#8a5c00;--abg:#fef8e7;--blue:#1557a0;--blbg:#e8f4ff;
  --sw:218px;--hh:58px;--r:8px;
}
html,body{height:100%;font-family:'Inter',-apple-system,Segoe UI,sans-serif;font-size:13.5px;color:var(--text);background:var(--bg);}
.app{display:flex;height:100vh;overflow:hidden;}

/* SIDEBAR */
.sb{width:var(--sw);background:var(--white);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;flex-shrink:0;position:relative;}
.sb::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--brand),var(--brand2));}
.sb-logo{padding:16px 16px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:11px;}
.sb-logo img{width:32px;height:auto;flex-shrink:0;}
.sb-logo .n{font-family:'Oswald';font-size:14.5px;font-weight:600;letter-spacing:.5px;line-height:1.05;}
.sb-logo .s{font-size:8.5px;color:var(--t3);margin-top:3px;letter-spacing:.9px;text-transform:uppercase;font-family:'Oswald';font-weight:400;}
.sb-sec{padding:14px 16px 5px;font-size:8px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--t3);font-family:'Oswald';}
.sb-it{display:flex;align-items:center;gap:9px;padding:8px 16px;cursor:pointer;font-size:13px;color:var(--t2);border-left:2.5px solid transparent;transition:all .12s;user-select:none;}
.sb-it:hover{background:#f7f7f5;color:var(--text);}
.sb-it.on{color:var(--text);font-weight:600;border-left-color:var(--brand);background:#f4f0f0;}
.sb-it.off{opacity:.55;}
.sb-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.sb-tag{margin-left:auto;font-size:9px;color:var(--t3);font-family:'Oswald';font-weight:400;letter-spacing:.4px;text-transform:uppercase;}
.sb-foot{margin-top:auto;padding:14px 16px;border-top:1px solid var(--border);font-size:9.5px;color:var(--t3);line-height:1.8;}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;}
.topbar{height:var(--hh);background:var(--white);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 22px;gap:12px;flex-shrink:0;position:relative;z-index:200;}
.tb-ttl{font-family:'Oswald';font-size:15px;font-weight:600;letter-spacing:.3px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase;}

/* CALENDAR — MONTH PICKER */
.cal-wrap{position:relative;flex-shrink:0;}
.cal-btn{display:flex;align-items:center;gap:8px;padding:6px 13px;background:var(--white);border:1.5px solid var(--border);border-radius:6px;cursor:pointer;font-family:inherit;font-size:12.5px;color:var(--text);user-select:none;white-space:nowrap;min-width:212px;transition:border-color .12s;}
.cal-btn:hover{border-color:#a8a8a2;}
.cal-btn .cl{flex:1;font-weight:500;overflow:hidden;text-overflow:ellipsis;}
.cal-btn .ca{font-size:8px;color:var(--t3);transition:transform .15s;}
.cal-btn .ca.up{transform:rotate(180deg);}
.cal-dd{display:none;position:absolute;top:calc(100% + 6px);right:0;background:var(--white);border:1.5px solid var(--border);border-radius:var(--r);box-shadow:0 10px 36px rgba(0,0,0,.13);z-index:400;width:440px;overflow:hidden;flex-direction:column;}
.cal-dd.open{display:flex;}
.cal-hd{padding:13px 16px 4px;font-family:'Oswald';font-size:9px;font-weight:600;letter-spacing:1.1px;text-transform:uppercase;color:var(--t3);}
.cal-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px 16px 16px;}
.cal-mo{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 11px;border:1px solid var(--border);border-radius:6px;background:var(--white);font-family:inherit;font-size:12.5px;font-weight:500;color:var(--text);cursor:pointer;transition:all .12s;text-align:left;}
.cal-mo em{font-style:normal;font-size:9px;color:var(--t3);letter-spacing:.4px;}
.cal-mo:hover:not(:disabled){border-color:#a8a8a2;background:var(--bg);}
.cal-mo.msel{background:var(--brand);border-color:var(--brand);color:#fff;}
.cal-mo.msel em{color:rgba(255,255,255,.75);}
.cal-mo:disabled{opacity:.3;cursor:default;}
.cal-bar{border-top:1px solid var(--border);padding:9px 16px;display:flex;align-items:center;justify-content:space-between;background:#fafaf8;}
.cal-sum{font-size:12px;color:var(--t2);font-weight:500;}
.cal-clr{font-size:11.5px;color:var(--t3);cursor:pointer;border:none;background:none;font-family:inherit;padding:4px 8px;border-radius:4px;}
.cal-clr:hover{background:var(--bg);}

/* TABS */
.tabs{display:flex;gap:1px;background:var(--bg);border:1.5px solid var(--border);border-radius:6px;padding:2px;flex-shrink:0;}
.tab{padding:5px 13px;border-radius:4px;font-size:11.5px;cursor:pointer;color:var(--t2);white-space:nowrap;transition:all .12s;}
.tab.on{background:var(--white);color:var(--text);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08);}

/* CONTENT + WATERMARK */
.content{flex:1;overflow-y:auto;padding:22px 26px;position:relative;}
.content::before{content:"";position:fixed;right:-60px;bottom:-70px;width:420px;height:483px;background-image:var(--wm);background-size:contain;background-repeat:no-repeat;opacity:.04;pointer-events:none;z-index:0;}
.content > *{position:relative;z-index:1;}

/* KPI */
.kg{display:grid;gap:13px;margin-bottom:18px;}
.kc{background:var(--white);border:1px solid var(--border);border-top:2.5px solid var(--brand);border-radius:var(--r);padding:16px 18px;}
.kl{font-family:'Oswald';font-size:8.5px;font-weight:500;letter-spacing:1.1px;text-transform:uppercase;color:var(--t3);margin-bottom:8px;}
.kv{font-family:'Oswald';font-size:28px;font-weight:600;line-height:1;letter-spacing:-.3px;}
.kv.na{color:var(--t3);font-size:21px;}
.kv.good{color:var(--green);}
.ks{font-size:10.5px;color:var(--t3);margin-top:5px;}

/* PANELS */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px;}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px;}
.sec{display:flex;align-items:center;justify-content:space-between;margin:22px 0 11px;}
.sec h2{font-family:'Oswald';font-size:9px;font-weight:600;letter-spacing:1.1px;text-transform:uppercase;color:var(--t3);}
.secn{font-size:11px;color:var(--t3);}
.panel{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:18px 20px;}
.pttl{font-family:'Oswald';font-size:8.5px;font-weight:500;letter-spacing:1px;text-transform:uppercase;color:var(--t3);margin-bottom:14px;}

/* BARS */
.bars{display:flex;flex-direction:column;gap:9px;}
.brow{display:flex;align-items:center;gap:10px;}
.blbl{width:122px;font-size:12px;color:var(--t2);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0;}
.btrack{flex:1;height:18px;background:var(--bg);border-radius:3px;overflow:hidden;}
.bfill{height:100%;border-radius:3px;transition:width .5s cubic-bezier(.4,0,.2,1);}
.bnum{width:86px;font-family:'Oswald';font-size:12.5px;font-weight:600;text-align:right;flex-shrink:0;white-space:nowrap;}

/* PLAN VS ACTUAL */
.pva{display:flex;flex-direction:column;gap:15px;}
.pvrow .pvhd{display:flex;justify-content:space-between;font-size:11.5px;color:var(--t2);margin-bottom:6px;}
.pvhd b{font-family:'Oswald';font-size:13px;}
.pvtrack{height:8px;background:var(--bg);border-radius:4px;overflow:hidden;margin-bottom:4px;position:relative;}
.pvfill{height:100%;border-radius:4px;}
.pvmark{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--text);}
.pvfoot{font-size:10.5px;color:var(--t3);}

/* TABLES */
.dt{width:100%;border-collapse:collapse;font-size:13px;}
.dt thead th{font-family:'Oswald';font-size:8.5px;font-weight:500;letter-spacing:.9px;text-transform:uppercase;color:var(--t3);padding:9px 10px;border-bottom:1.5px solid var(--border);text-align:right;white-space:nowrap;}
.dt thead th:first-child{text-align:left;}
.dt thead th.thc{width:38px;padding:9px 6px;}
.dt thead th.tha{width:270px;padding:9px 8px;text-align:left;}
.dt tbody td{padding:9px 10px;border-bottom:1px solid var(--borderl);text-align:right;white-space:nowrap;}
.dt tbody td:first-child{text-align:left;}
.dt tbody tr:last-child td{border-bottom:none;}
.dt tbody tr:hover td{background:#f9f9f7;}
.dt tbody tr.zero td{color:var(--t3);}
.dt tfoot td{font-family:'Oswald';font-size:12.5px;font-weight:600;padding:10px;border-top:2px solid var(--text);text-align:right;background:#f6f6f4;white-space:nowrap;}
.dt tfoot td:first-child{text-align:left;}
.vc{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}
.vdot{width:8px;height:8px;border-radius:50%;flex-shrink:0;display:inline-block;}
.tog{cursor:pointer;color:var(--t3);font-size:9px;user-select:none;padding:3px 6px;border-radius:4px;display:inline-block;transition:all .12s;}
.tog:hover{background:var(--bg);color:var(--text);}
.tog.open{color:var(--brand);}
.ads-row td{background:#fbfbf9 !important;font-size:12px;color:var(--t2);}

/* PILLS */
.mt{font-family:'Oswald';font-size:8.5px;font-weight:500;letter-spacing:.8px;text-transform:uppercase;padding:2px 7px;border-radius:3px;white-space:nowrap;}
.mt.phrase{background:var(--bbg);color:var(--brand);}
.mt.exact{background:#eceef1;color:var(--text);}
.mt.broad{background:var(--abg);color:var(--amber);}
.act{font-size:10.5px;padding:2px 8px;border-radius:10px;font-weight:600;white-space:nowrap;display:inline-block;}
.act.win{background:var(--gbg);color:var(--green);}
.act.keep{background:var(--blbg);color:var(--blue);}
.act.watch{background:var(--abg);color:var(--amber);}
.act.fix{background:var(--rbg);color:var(--red);}

/* STACK */
.stack{display:flex;height:30px;border-radius:5px;overflow:hidden;margin-bottom:13px;}
.stack div{height:100%;}
.lgd{display:flex;flex-direction:column;gap:7px;}
.lgrow{display:flex;align-items:center;gap:8px;font-size:12px;}
.lgsw{width:10px;height:10px;border-radius:2px;flex-shrink:0;}
.lgnm{flex:1;color:var(--t2);}
.lgvl{font-family:'Oswald';font-weight:600;}

/* SPEND */
.spend-month-block{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;margin-bottom:14px;}
.spend-month-hd{display:flex;align-items:center;justify-content:space-between;padding-bottom:10px;margin-bottom:12px;border-bottom:1px solid var(--borderl);}
.spend-month-name{font-family:'Oswald';font-size:13px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;}
.spend-month-total{font-family:'Oswald';font-size:16px;font-weight:600;}
.svr{display:flex;align-items:center;gap:10px;padding:7px 0;}
.svr-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.svr-name{width:120px;font-size:12.5px;flex-shrink:0;}
.svr-bwrap{flex:1;height:16px;background:var(--bg);border-radius:3px;overflow:hidden;}
.svr-bar{height:100%;border-radius:3px;}
.svr-amt{width:84px;text-align:right;font-family:'Oswald';font-size:12.5px;font-weight:600;flex-shrink:0;}
.svr-tog{width:30px;text-align:right;flex-shrink:0;}
.svr-tog button{border:none;background:none;color:var(--t3);cursor:pointer;font-size:9px;padding:3px 5px;border-radius:4px;}
.svr-tog button:hover{background:var(--bg);color:var(--text);}
.svr-tog button.open{color:var(--brand);}
.swr-wrap{margin:2px 0 8px 138px;border-left:2px solid var(--borderl);padding-left:12px;}
.swr{display:flex;align-items:center;gap:10px;padding:4px 0;font-size:11.5px;color:var(--t2);}
.swr-lbl{width:150px;flex-shrink:0;}
.swr-acts{flex:1;color:var(--t3);font-size:11px;}
.swr-amt{width:70px;text-align:right;font-family:'Oswald';font-weight:600;}

/* AD PREVIEW */
.adprev{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:18px 20px;}
.adp-tag{display:inline-block;font-size:10px;font-weight:700;border:1px solid var(--text);border-radius:3px;padding:0 4px;margin-right:6px;}
.adp-url{font-size:12px;color:var(--t2);margin-bottom:7px;}
.adp-h{font-size:16px;color:#1a0dab;line-height:1.35;margin-bottom:7px;}
.adp-d{font-size:12.5px;color:var(--t2);line-height:1.5;}
.adp-sl{margin-top:10px;font-size:12.5px;color:#1a0dab;}

/* MISC */
.bhd{display:flex;align-items:center;gap:11px;margin-bottom:18px;flex-wrap:wrap;}
.bicon{width:38px;height:38px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Oswald';font-weight:600;font-size:12px;letter-spacing:.5px;flex-shrink:0;}
.bname{font-family:'Oswald';font-size:19px;font-weight:600;letter-spacing:.3px;text-transform:uppercase;}
.bpill{font-size:11px;color:var(--t2);background:var(--white);border:1px solid var(--border);padding:4px 11px;border-radius:12px;}
.ndpill{font-size:11px;color:var(--amber);background:var(--abg);padding:4px 11px;border-radius:12px;}
.infobox{background:var(--white);border:1px solid var(--border);border-left:3px solid var(--brand);border-radius:6px;padding:13px 16px;font-size:12.5px;color:var(--t2);line-height:1.65;margin-bottom:16px;}
.infobox.good{border-left-color:var(--green);}
.infobox.warn{border-left-color:var(--amber);}
.infobox strong{color:var(--text);}
.nodata{background:var(--white);border:1px dashed var(--border);border-radius:var(--r);padding:44px;text-align:center;color:var(--t3);font-size:13px;line-height:1.8;}
.footer{display:flex;justify-content:space-between;align-items:center;padding:16px 2px 8px;margin-top:8px;border-top:1px solid var(--border);font-size:10.5px;color:var(--t3);}
@media(max-width:1340px){.g2,.g3{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="app">

<aside class="sb">
  <div class="sb-logo">
    <img id="sbLogo" alt="BIM Technologists"/>
    <div><div class="n">BIM</div><div class="s">Technologists</div></div>
  </div>
  <div class="sb-sec">Overview</div>
  <div class="sb-it on" onclick="nav('all',this)"><span class="sb-dot" style="background:#101114;"></span>All Campaigns</div>
  <div class="sb-sec">Campaigns</div>
  <div class="sb-it" onclick="nav('gcc',this)"><span class="sb-dot" style="background:#B72025;"></span>GCC</div>
  <div class="sb-it off" onclick="nav('eur',this)"><span class="sb-dot" style="background:#c4c4c0;"></span>Europe<span class="sb-tag">Not live</span></div>
  <div class="sb-foot">BIM Technologists · Google Search Ads<br/>bim-techno.com<br/><span id="upd"></span></div>
</aside>

<div class="main">
  <div class="topbar">
    <div class="tb-ttl" id="tbt">All Campaigns — Overview</div>
    <div class="cal-wrap" id="cW">
      <div class="cal-btn" id="cB"><span>📅</span><span class="cl" id="cL">—</span><span class="ca" id="cA">▼</span></div>
      <div class="cal-dd" id="cD">
        <div class="cal-hd">Select month</div>
        <div class="cal-grid" id="cG"></div>
        <div class="cal-bar"><button class="cal-clr" onclick="calReset()">Reset</button><span class="cal-sum" id="cS">—</span></div>
      </div>
    </div>
    <div class="tabs">
      <div class="tab on" onclick="setTab('perf',this)">Performance</div>
      <div class="tab" onclick="setTab('kw',this)">Keywords</div>
      <div class="tab" onclick="setTab('aud',this)">Audience</div>
      <div class="tab" onclick="setTab('ast',this)">Ad &amp; Assets</div>
      <div class="tab" onclick="setTab('spend',this)">Spend</div>
    </div>
  </div>
  <div class="content" id="cnt"></div>
</div>
</div>

function agg(pids,cid,k){return pids.reduce((a,p)=>{const x=PR.find(y=>y.id===p);return a+(x?.c[cid]?.[k]||0);},0);}
function aggAll(pids,k){return C.reduce((a,v)=>a+agg(pids,v.id,k),0);}
function rows(pids,cid,key,idk){
  const m={};
  pids.forEach(p=>{const x=PR.find(y=>y.id===p);(x?.c[cid]?.[key]||[]).forEach(o=>{
    const id=o[idk];
    if(!m[id])m[id]={...o,im:0,cl:0,cost:0};
    m[id].im+=o.im||0;m[id].cl+=o.cl||0;m[id].cost+=o.cost||0;
    if(o.note)m[id].note=o.note; if(o.a)m[id].a=o.a;});});
  return Object.values(m);
}
function first(pids,cid,k){for(const p of pids){const x=PR.find(y=>y.id===p);const v=x?.c[cid]?.[k];if(v&&(!Array.isArray(v)||v.length))return v;}return null;}

/* plan-vs-actual row: lower=true means lower is better */
function pvRow(label,actual,plan,fmt,lower,foot){
  const ratio=plan?Math.min(actual/plan,1.6):0;
  const good=lower?actual<=plan:actual>=plan;
  const col=good?'var(--green)':'var(--amber)';
  return`<div class="pvrow"><div class="pvhd"><span>${label}</span><span><b style="color:${col};">${fmt(actual)}</b> <span style="color:var(--t3);">vs ${fmt(plan)} planned</span></span></div>
  <div class="pvtrack"><div class="pvfill" style="width:${Math.min(ratio/1.6*100,100).toFixed(1)}%;background:${col};"></div><div class="pvmark" style="left:${(1/1.6*100).toFixed(1)}%;"></div></div>
  <div class="pvfoot">${foot}</div></div>`;
}

    <thead><tr><th style="text-align:left;min-width:160px;">Asset</th><th style="text-align:left;width:92px;">Level</th><th>Clicks</th><th>Impr.</th><th>CTR</th><th>Avg. CPC</th><th>CPM</th><th>Cost</th></tr></thead>
    <tbody>${r}</tbody>
    <tfoot><tr><td>TOTAL — SITELINKS</td><td></td><td>${fN(tot.cl)}</td><td>${fN(tot.im)}</td><td>${fP(rCTR(tot.cl,tot.im))}</td><td>${f2(rCPC(tot.cost,tot.cl))}</td><td>${f2(rCPM(tot.cost,tot.im))}</td><td>${f2(tot.cost)}</td></tr></tfoot></table></div>
    <div class="infobox"><strong>Why the rows do not add up to the total.</strong> A single ad can show several sitelinks at once, so each asset records that impression and click independently.
    The total row is Google's de-duplicated figure, and it is the one that reconciles with campaign spend.</div>`;
  }).join('');
  return`<div>
  <div class="infobox good"><strong>Sitelinks are doing most of the work.</strong> 285 of the campaign's 482 clicks — 59% — came through sitelinks rather than the headline,
  and About Us and Contact Us both outperform Our Services. People are checking who the company is and how to reach it before they read about the service itself.
  That argues for strengthening the About and Contact pages, and for adding sitelinks that answer the same question in other ways.</div>
  ${out}
  <div class="footer"><span>Period: ${sLbl()}</span><span>BIM Technologists — Ad &amp; Assets</span></div></div>`;
}

/* ═══════ SPEND ═══════ */
function renderSpend(){
  const pt={};C.forEach(v=>MNO.forEach(mk=>{if(!pt[mk])pt[mk]=0;pt[mk]+=(MS[v.id]?.months?.[mk]?.t||0);}));
  const act=MNO.filter(mk=>pt[mk]>0);
  if(!act.length)return'<div class="nodata">No spend recorded yet.</div>';
  const grand=Object.values(pt).reduce((a,b)=>a+b,0);
  const co=sAll('cost'),im=sAll('im'),cl=sAll('cl'),d=sDays();
  const kpi=`<div class="kc"><div class="kl">Invested to date</div><div class="kv">${f2(grand)}</div><div class="ks">GCC only</div></div>
    <div class="kc"><div class="kl">Daily average</div><div class="kv">${f2(co/d)}</div><div class="ks">Across ${d} days · $16.45 planned</div></div>
    <div class="kc"><div class="kl">Cost per click</div><div class="kv good">${f2(rCPC(co,cl))}</div><div class="ks">What the traffic cost</div></div>
    <div class="kc"><div class="kl">CPM</div><div class="kv">${f2(rCPM(co,im))}</div><div class="ks">Cost per 1,000 impressions</div></div>`;
  const blocks=act.map(mk=>{
    const mx=Math.max(...C.map(v=>MS[v.id]?.months?.[mk]?.t||0),1);
    const r=C.map(v=>{
      const md=MS[v.id]?.months?.[mk];if(!md||!md.t)return'';
      const key=`${v.id}_${mk}`,isO=!!SEX[key];
      const wr=isO&&md.w?.length?`<div class="swr-wrap">${md.w.map(w=>`<div class="swr"><div class="swr-lbl">${w.l}</div><div class="swr-acts">${w.a||''}</div><div class="swr-amt">${f2(w.s)}</div></div>`).join('')}</div>`:'';
      return`<div><div class="svr"><span class="svr-dot" style="background:${v.c};"></span><span class="svr-name">${v.name}</span><div class="svr-bwrap"><div class="svr-bar" style="width:${((md.t/mx)*100).toFixed(1)}%;background:${v.c}cc;"></div></div><span class="svr-amt">${f2(md.t)}</span><span class="svr-tog">${md.w?.length?`<button class="${isO?'open':''}" onclick="togSX('${key}',event)">${isO?'▲':'▼'}</button>`:''}</span></div>${wr}</div>`;
    }).join('');
    return`<div class="spend-month-block"><div class="spend-month-hd"><span class="spend-month-name">${MNL[mk]}</span><span class="spend-month-total">${f2(pt[mk])}</span></div>${r}</div>`;
  }).join('');
  return`<div><div class="kg" style="grid-template-columns:repeat(4,1fr);">${kpi}</div>${blocks}
  <div class="infobox"><strong>Europe has not launched.</strong> With GCC clicks landing at ${f2(rCPC(co,cl))} against the $2.71 modelled,
  the open question for the next flight is whether that European budget does more work added to GCC — where the auction is proven cheap and demand is real —
  or held back for the European launch as originally planned.</div>
  <div class="footer"><span>Flight total as reported in Google Ads.</span><span>BIM Technologists — Spend</span></div></div>`;
}

/* ═══════ SINGLE CAMPAIGN ═══════ */
function renderCampaign(id){
  const v=C.find(x=>x.id===id);
  if(!v.live)return`<div><div class="bhd"><div class="bicon" style="background:${v.c};">${v.ab}</div><div class="bname">${v.name}</div><span class="ndpill">Not launched</span></div>
    <div class="nodata" style="padding:60px;">The Europe campaign has not gone live yet.<br/>
    Planned across the UK, Ireland, Germany, the Netherlands, Belgium, France and the Nordics, mirroring the GCC build.<br/>
    This view fills in automatically once it starts delivering.</div></div>`;
  const co=sD(id,'cost'),im=sD(id,'im'),cl=sD(id,'cl'),d=sDays();
  const kws=rows(SEL,id,'kw','n').filter(k=>k.im).sort((a,b)=>b.cost-a.cost);
  const ages=rows(SEL,id,'age','g');
  const mxCo=Math.max(...ages.map(a=>a.cost),1);
  const ageB=ages.map(a=>`<div class="brow"><div class="blbl">${a.g}</div><div class="btrack"><div class="bfill" style="width:${(a.cost/mxCo*100).toFixed(1)}%;background:${v.c}28;border-right:3px solid ${v.c};"></div></div><div class="bnum" style="color:${v.c};">${f2(a.cost)}</div></div>`).join('');
  const mxCl=Math.max(...kws.map(k=>k.cl),1);
  const kwB=kws.map(k=>`<div class="brow"><div class="blbl">${k.n}</div><div class="btrack"><div class="bfill" style="width:${(k.cl/mxCl*100).toFixed(1)}%;background:${v.c}28;border-right:3px solid ${v.c};"></div></div><div class="bnum" style="color:${v.c};">${fN(k.cl)}</div></div>`).join('');
  const kR=kws.map(k=>`<tr><td>${k.n}</td><td style="text-align:left;"><span class="mt ${k.mt}">${k.mt}</span></td><td>${f2(k.cost)}</td><td>${fN(k.im)}</td><td>${fN(k.cl)}</td><td>${fP(rCTR(k.cl,k.im))}</td><td>${f2(rCPC(k.cost,k.cl))}</td><td>${f2(rCPM(k.cost,k.im))}</td><td style="text-align:left;white-space:normal;padding:8px 10px;">${k.note||''}</td></tr>`).join('');
  return`<div>
    <div class="bhd"><div class="bicon" style="background:${v.c};">${v.ab}</div><div class="bname">${v.name}</div>
      <span class="bpill">📅 ${sLbl()}</span><span class="bpill">${v.geo}</span><span class="bpill">${d} days live</span></div>
    <div class="kg" style="grid-template-columns:repeat(6,1fr);">
      <div class="kc"><div class="kl">Cost</div><div class="kv">${f0(co)}</div><div class="ks">${f2(co/d)}/day</div></div>
      <div class="kc"><div class="kl">Impressions</div><div class="kv">${fK(im)}</div><div class="ks">Times shown</div></div>
      <div class="kc"><div class="kl">Clicks</div><div class="kv">${fN(cl)}</div><div class="ks">Visits to the site</div></div>
      <div class="kc"><div class="kl">CTR</div><div class="kv">${fP(rCTR(cl,im))}</div><div class="ks">Clicks ÷ impressions</div></div>
      <div class="kc"><div class="kl">Avg. CPC</div><div class="kv good">${f2(rCPC(co,cl))}</div><div class="ks">Cost per click</div></div>
      <div class="kc"><div class="kl">CPM</div><div class="kv">${f2(rCPM(co,im))}</div><div class="ks">Cost per 1,000 impressions</div></div>
    </div>
    <div class="g2">
      <div class="panel"><div class="pttl">Clicks by keyword</div><div class="bars">${kwB}</div></div>
      <div class="panel"><div class="pttl">Cost by age</div><div class="bars">${ageB}</div></div>
    </div>
    <div class="sec"><h2>Keywords that delivered</h2><span class="secn">${kws.length} of 9 served impressions</span></div>
    <div class="panel" style="padding:0;overflow:hidden;margin-bottom:18px;"><table class="dt">
    <thead><tr><th style="text-align:left;">Keyword</th><th style="text-align:left;width:72px;">Match</th><th>Cost</th><th>Impr.</th><th>Clicks</th><th>CTR</th><th>Avg. CPC</th><th>CPM</th><th class="tha">Analysis</th></tr></thead>
    <tbody>${kR}</tbody></table></div>
    <div class="footer"><span>Period: ${sLbl()}</span><span>BIM Technologists · ${v.name}</span></div>
  </div>`;
}

/* ═══════ ROUTER ═══════ */
function render(){
  let h='';
  if(VIEW==='all'){
    h = TAB==='perf'?renderPerf() : TAB==='kw'?renderKW() : TAB==='aud'?renderAud() : TAB==='ast'?renderAst() : renderSpend();
  } else h=renderCampaign(VIEW);
  const c=document.getElementById('cnt');
  c.innerHTML=h; c.scrollTop=0;
}
document.getElementById('upd').textContent=UPDATED;
buildCal();render();
</script>
</body>
</html>
